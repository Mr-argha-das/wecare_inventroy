name: Build APK

# Copy this file into the wecare-app repo at:
#     .github/workflows/build-apk.yml
#
# Then: GitHub -> Actions -> "Build APK" -> Run workflow
# When it finishes, download the APK from the run's "Artifacts" section.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which build to produce"
        type: choice
        default: release
        options: [release, debug]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name "*.apk" -exec \
            cp {} dist/wecare-${{ github.run_number }}.apk \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wecare-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
