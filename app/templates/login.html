<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | {{ app_name }}</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>&#10010; WE CARE</h1>
    <div class="sub">HOME HEALTHCARE</div>
    {% if flashes %}
    <div class="flashes">
      {% for f in flashes %}<div class="flash flash-{{ f.category }}">{{ f.message }}</div>{% endfor %}
    </div>
    {% endif %}
    <form method="post" action="/auth/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next|default('/') }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="small muted text-center mt">Secure staff login. All activity is logged.</p>
  </div>
</div>
</body>
</html>
