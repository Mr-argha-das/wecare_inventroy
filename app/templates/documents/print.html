<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ doc.title }} - {{ doc.company.brand_name }}</title>
<link rel="stylesheet" href="/static/css/invoice_a4.css">
<style>
  :root {
    --inv-green: {{ doc.company.invoice_color }};
    --inv-rule: {{ doc.company.rule_color }};
    --inv-title: {{ doc.company.title_color }};
    --inv-link: {{ doc.company.link_color }};
  }
</style>
</head>
<body class="invoice-doc screen">

<div class="doc-toolbar no-print">
  <span class="title">{{ doc.title }} &middot; {{ doc.doc_number }}</span>
  <button type="button" class="primary" onclick="window.print()">Print / Save as PDF</button>
  {% if can('generate_pdf') %}<a href="/documents/{{ doc_type }}/{{ ref_id }}/pdf">Download PDF</a>{% endif %}
  {% if can('share_whatsapp') %}<a href="/documents/{{ doc_type }}/{{ ref_id }}/whatsapp">WhatsApp</a>{% endif %}
  <a href="{{ back_url }}">Back</a>
</div>

{% include "documents/_invoice_pages.html" %}

</body>
</html>
